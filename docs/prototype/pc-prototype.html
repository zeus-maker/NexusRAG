<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企业级 RAG 3.0 知识库系统 - PC 原型 v3</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --bg: #f9fafb;
      --panel: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --radius: 8px;
      --radius-lg: 12px;
      --sidebar-w: 224px;
      --topbar-h: 48px;
      --statusbar-h: 24px;
      --green: #16a34a;
      --amber: #d97706;
      --red: #dc2626;
      --shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; border: none; background: none; }
    a { color: var(--primary); text-decoration: none; }

    /* Login */
    .login-page { min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #e6f4ff 0%, #f5f5f5 50%, #f6ffed 100%); }
    .login-card { width: 400px; background: var(--panel); border-radius: 8px; padding: 40px; box-shadow: 0 6px 16px rgba(0,0,0,.08); }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo .mark { width: 48px; height: 48px; margin: 0 auto 12px; border-radius: 8px; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 20px; font-weight: 700; }
    .login-logo h1 { font-size: 20px; }
    .login-logo p { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .form-item { margin-bottom: 20px; }
    .form-item label { display: block; margin-bottom: 6px; font-size: 13px; }
    .form-item input { width: 100%; height: 36px; padding: 0 11px; border: 1px solid var(--border); border-radius: var(--radius); outline: none; }
    .form-item input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,.1); }
    .btn { height: 36px; padding: 0 15px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--panel); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 500; box-shadow: var(--shadow); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-block { width: 100%; justify-content: center; }
    .btn-sm { height: 28px; padding: 0 10px; font-size: 13px; }
    .btn-danger { color: var(--red); border-color: #ffa39e; background: #fff2f0; }

    /* App Layout */
    .app { display: none; height: 100vh; flex-direction: column; }
    .app.visible { display: flex; }
    .topbar { display: flex; align-items: center; gap: 12px; height: var(--topbar-h); padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 100; }
    .topbar-toggle { width: 32px; height: 32px; border-radius: var(--radius); display: grid; place-items: center; color: var(--muted); }
    .topbar-toggle:hover { background: #f3f4f6; }
    .topbar-breadcrumb { flex: 1; display: flex; align-items: center; gap: 6px; font-size: 13px; min-width: 0; overflow: hidden; }
    .crumb { color: var(--muted); white-space: nowrap; }
    .crumb.current { color: var(--text); font-weight: 600; }
    .crumb-sep { color: #d1d5db; }
    .topbar-search { position: relative; flex-shrink: 0; }
    .topbar-search input { width: 208px; height: 32px; padding: 0 12px 0 30px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: #f9fafb; outline: none; font-size: 12px; }
    .topbar-search input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
    .topbar-search .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; }
    .topbar-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    .icon-btn { width: 32px; height: 32px; border-radius: var(--radius); display: grid; place-items: center; background: transparent; color: var(--muted); position: relative; }
    .icon-btn:hover { background: #f3f4f6; }
    .icon-btn .notif-dot { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; background: var(--red); border-radius: 50%; }
    .user-menu { display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 4px; border-radius: var(--radius-lg); }
    .user-menu:hover { background: #f3f4f6; }
    .user-avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700; }

    .body-wrap { display: flex; flex: 1; min-height: 0; overflow: hidden; }
    .sidebar { width: var(--sidebar-w); background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; transition: width .25s; }
    .sidebar.collapsed { width: 64px; }
    .sidebar.collapsed .nav-label, .sidebar.collapsed .nav-sub, .sidebar.collapsed .sidebar-logo-text, .sidebar.collapsed .sidebar-footer { display: none; }
    .sidebar-logo { display: flex; align-items: center; gap: 10px; height: var(--topbar-h); padding: 0 16px; border-bottom: 1px solid #f3f4f6; flex-shrink: 0; }
    .sidebar-logo .mark { width: 28px; height: 28px; border-radius: var(--radius); background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 14px; flex-shrink: 0; }
    .sidebar-logo-text .title { font-size: 14px; font-weight: 700; line-height: 1.2; }
    .sidebar-logo-text .sub { font-size: 10px; color: var(--muted); }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
    .nav-group { margin-bottom: 2px; }
    .nav-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 16px; color: #4b5563; text-align: left; font-size: 14px; transition: background .15s; border-right: 2px solid transparent; }
    .nav-item:hover { background: #f9fafb; color: var(--text); }
    .nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 500; border-right-color: var(--primary); }
    .nav-item .icon { width: 18px; text-align: center; flex-shrink: 0; opacity: .85; }
    .nav-sub { background: rgba(249,250,251,.7); }
    .nav-sub .nav-item { padding: 8px 16px 8px 44px; font-size: 13px; gap: 8px; }
    .sidebar-footer { padding: 12px 16px; border-top: 1px solid #f3f4f6; font-size: 10px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .sidebar-footer .dot-live { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

    .main { flex: 1; overflow-y: auto; padding: 24px; min-width: 0; background: var(--bg); }
    .view { display: none; }
    .view.active { display: block; }

    .page-hd { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 16px; flex-wrap: wrap; }
    .breadcrumb { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
    .page-hd h2 { font-size: 20px; font-weight: 600; }
    .page-hd p { color: var(--muted); margin-top: 4px; font-size: 13px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
    .field, .select { height: 32px; padding: 0 11px; border: 1px solid var(--border); border-radius: var(--radius); outline: none; background: #fff; }
    .field:focus, .select:focus { border-color: var(--primary); }

    .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
    .card-hd { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .card-hd h3 { font-size: 15px; font-weight: 600; }
    .card-bd { padding: 16px; }

    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
    .metric { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .metric .label { color: var(--muted); font-size: 13px; }
    .metric .value { font-size: 28px; font-weight: 700; margin: 8px 0 4px; }
    .metric .trend { font-size: 12px; color: var(--green); }

    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; height: 22px; border-radius: 4px; font-size: 12px; border: 1px solid; }
    .tag-green { background: #f6ffed; border-color: #b7eb8f; color: #389e0d; }
    .tag-amber { background: #fffbe6; border-color: #ffe58f; color: #d48806; }
    .tag-red { background: #fff2f0; border-color: #ffccc7; color: #cf1322; }
    .tag-blue { background: #e6f4ff; border-color: #91caff; color: var(--primary); }
    .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
    .dot-green { background: var(--green); }
    .dot-amber { background: var(--amber); }
    .dot-red { background: var(--red); }

    .kb-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .kb-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; cursor: pointer; transition: box-shadow .2s, border-color .2s; }
    .kb-card:hover { border-color: #93c5fd; box-shadow: 0 4px 12px rgba(37,99,235,.1); }
    .kb-card .emoji { font-size: 24px; margin-bottom: 8px; }
    .kb-card h4 { font-size: 15px; margin-bottom: 4px; }
    .kb-card .desc { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
    .kb-card .stats { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .kb-card .foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }

    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .tab { padding: 10px 16px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }

    .table { width: 100%; border-collapse: collapse; }
    .table th, .table td { padding: 12px; text-align: left; border-bottom: 1px solid #f0f0f0; }
    .table th { background: #fafafa; color: var(--muted); font-weight: 500; font-size: 13px; }
    .table tr:hover td { background: #fafafa; }

    .progress { height: 6px; background: #f0f0f0; border-radius: 3px; overflow: hidden; }
    .progress span { display: block; height: 100%; background: var(--primary); border-radius: 3px; }

    .upload-zone { border: 2px dashed #91caff; border-radius: 8px; padding: 48px; text-align: center; background: #fafcff; }
    .upload-zone h3 { margin-bottom: 8px; }
    .upload-zone p { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

    .parse-layout { display: grid; grid-template-columns: 180px 1fr 280px; gap: 12px; min-height: 480px; }
    .outline { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; background: #fff; }
    .outline-item { padding: 6px 8px; border-radius: 4px; font-size: 13px; color: var(--muted); cursor: pointer; }
    .outline-item.active, .outline-item:hover { background: #e6f4ff; color: var(--primary); }
    .doc-render { border: 1px solid var(--border); border-radius: var(--radius); background: #f0f0f0; padding: 20px; overflow: auto; }
    .doc-page { background: #fff; margin: 0 auto; width: 90%; max-width: 560px; min-height: 400px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,.1); position: relative; }
    .layout-box { position: absolute; border: 2px solid; border-radius: 2px; font-size: 10px; padding: 2px 4px; }
    .box-title { top: 30px; left: 30px; right: 30px; height: 40px; border-color: var(--primary); color: var(--primary); }
    .box-table { top: 120px; left: 30px; right: 30px; height: 120px; border-color: var(--green); color: var(--green); }
    .json-panel { border: 1px solid var(--border); border-radius: var(--radius); background: #fafafa; overflow: auto; }
    .json-panel pre { padding: 12px; font-size: 11px; line-height: 1.6; white-space: pre-wrap; }

    .chunk-item { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; }
    .chunk-hd { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .chunk-bd { font-size: 13px; line-height: 1.6; margin-bottom: 8px; }
    .chunk-ft { display: flex; gap: 8px; font-size: 12px; }

    .index-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .index-card { border: 1px solid var(--border); border-radius: 8px; padding: 14px; text-align: center; }
    .index-card .icon { font-size: 20px; margin-bottom: 6px; }
    .index-card .count { font-size: 18px; font-weight: 700; margin: 8px 0; }
    .index-card .pct { font-size: 13px; color: var(--muted); }

    /* Chat */
    .chat-layout { display: grid; grid-template-columns: 240px 1fr; gap: 0; min-height: calc(100vh - 180px); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--panel); }
    .conv-list { border-right: 1px solid var(--border); padding: 12px; overflow-y: auto; }
    .conv-list .btn { width: 100%; margin-bottom: 12px; }
    .conv-group { font-size: 11px; color: var(--muted); padding: 8px 8px 4px; text-transform: uppercase; }
    .conv-item { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: var(--radius); font-size: 13px; color: var(--text); }
    .conv-item:hover, .conv-item.active { background: #e6f4ff; color: var(--primary); }
    .chat-main { display: flex; flex-direction: column; }
    .chat-msgs { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 8px; }
    .msg-user { align-self: flex-end; background: #e6f4ff; border: 1px solid #91caff; }
    .msg-bot { align-self: flex-start; background: #fafafa; border: 1px solid var(--border); }
    .msg-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; }
    .msg-title { font-weight: 600; }
    .citation { display: inline-block; color: var(--primary); font-weight: 600; cursor: pointer; }
    .cite-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; margin-top: 10px; font-size: 12px; background: #fff; }
    .msg-actions { display: flex; gap: 6px; margin-top: 10px; }
    .chat-input { padding: 12px 16px; border-top: 1px solid var(--border); }
    .chat-input textarea { width: 100%; min-height: 72px; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius); resize: vertical; outline: none; }
    .chat-input-ft { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); }

    .enhance-panel { border: 1px solid var(--border); border-radius: 8px; margin-top: 16px; }
    .enhance-panel .card-hd { background: #fafafa; }
    .enhance-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
    .enhance-box { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; text-align: center; }
    .enhance-box .val { font-size: 16px; font-weight: 600; margin-top: 4px; }
    .enhance-box .sub { font-size: 11px; color: var(--muted); }

    .chart-bars { display: flex; align-items: flex-end; gap: 8px; height: 180px; padding: 0 8px 24px; border-bottom: 1px solid var(--border); }
    .chart-bar { flex: 1; background: linear-gradient(180deg, var(--primary), #69b1ff); border-radius: 4px 4px 0 0; min-height: 20px; position: relative; }
    .chart-bar::after { content: attr(data-m); position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--muted); }

    .layer-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 13px; }
    .layer-bar .bar { flex: 1; height: 20px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
    .layer-bar .bar span { display: block; height: 100%; background: var(--primary); }

    .ab-card { border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    .ab-variants { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 16px 0; }
    .ab-variant { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
    .ab-variant h4 { margin-bottom: 10px; }

    .role-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .role-card { border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; }
    .role-card:hover { border-color: var(--primary); }
    .role-card .count { font-size: 24px; font-weight: 700; color: var(--primary); margin: 8px 0; }

    .pipeline-item { display: flex; align-items: center; gap: 16px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; }
    .pipeline-item .name { flex: 1; font-weight: 500; }
    .switch { width: 44px; height: 22px; background: var(--green); border-radius: 11px; position: relative; }
    .switch::after { content: ''; position: absolute; width: 18px; height: 18px; background: #fff; border-radius: 50%; top: 2px; right: 2px; }
    .switch.off { background: #d9d9d9; }
    .switch.off::after { right: auto; left: 2px; }

    .statusbar { display: flex; align-items: center; gap: 16px; height: var(--statusbar-h); padding: 0 16px; background: #f9fafb; border-top: 1px solid var(--border); font-size: 10px; color: var(--muted); flex-shrink: 0; }
    .statusbar span { display: flex; align-items: center; gap: 4px; }
    .statusbar .sep { width: 1px; height: 12px; background: #d1d5db; }
    .statusbar .grow { flex: 1; }
    .app-footer { display: none; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; place-items: center; }
    .modal-overlay.open { display: grid; }
    .modal { width: 520px; max-width: 92vw; background: var(--panel); border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.12); }
    .modal-hd { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-hd h3 { font-size: 16px; }
    .modal-bd { padding: 20px; }
    .modal-ft { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    textarea.field { height: auto; padding: 8px 11px; min-height: 72px; resize: vertical; width: 100%; }

    .pagination { display: flex; justify-content: center; gap: 4px; margin-top: 20px; }
    .pagination button { width: 32px; height: 32px; border: 1px solid var(--border); border-radius: var(--radius); }
    .pagination button.active { background: var(--primary); border-color: var(--primary); color: #fff; }

    @media (max-width: 1200px) {
      .kb-grid, .metrics, .index-grid, .enhance-grid, .role-grid { grid-template-columns: repeat(2, 1fr); }
      .parse-layout { grid-template-columns: 1fr; }
    }
    .kb-subnav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .kb-subnav .btn { font-size: 12px; }
    .kb-subnav .btn.active { background: #e6f4ff; border-color: var(--primary); color: var(--primary); }
    .split-layout { display: grid; grid-template-columns: 240px 1fr; gap: 16px; min-height: 480px; }
    .wiki-tree { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; background: #fff; font-size: 13px; line-height: 1.8; }
    .wiki-content { border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; background: #fff; }
    .wiki-content h3 { margin-bottom: 12px; }
    .wiki-link { color: var(--primary); cursor: pointer; }
    .graph-canvas { min-height: 360px; border: 1px solid var(--border); border-radius: var(--radius); background: radial-gradient(circle at 30% 40%, #e6f4ff, #f5f5f5); position: relative; }
    .graph-node { position: absolute; width: 64px; height: 64px; border-radius: 50%; background: #fff; border: 2px solid var(--primary); display: grid; place-items: center; font-size: 11px; text-align: center; box-shadow: var(--shadow); }
    .agent-canvas { min-height: 400px; border: 1px dashed var(--border); border-radius: var(--radius); background: #fafcff; position: relative; }
    .agent-node { position: absolute; min-width: 100px; padding: 10px 12px; border: 2px solid var(--primary); border-radius: 8px; background: #fff; font-size: 12px; font-weight: 600; text-align: center; }
    .trace-timeline { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 12px; background: #fafafa; border: 1px solid var(--border); border-radius: var(--radius); font-size: 12px; margin-top: 12px; }
    .trace-step { padding: 6px 10px; background: #e6f4ff; border-radius: 4px; border: 1px solid #91caff; }
    .trace-arrow { color: var(--muted); }
    .config-section { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
    .config-section h4 { margin-bottom: 10px; font-size: 14px; }
    .home-apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .home-app { border: 1px solid var(--border); border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; background: #fff; }
    .home-app:hover { border-color: var(--primary); }
    .home-app .icon { font-size: 28px; margin-bottom: 8px; }
    .retrieval-layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; }
    .result-item { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 8px; font-size: 13px; }
    .result-item .score { float: right; color: var(--green); font-weight: 600; }

    /* v1.6 KB 左侧子导航 + Hub */
    .kb-layout { display: grid; grid-template-columns: 168px 1fr; gap: 20px; align-items: start; }
    .kb-sidenav { display: flex; flex-direction: column; gap: 2px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 8px; position: sticky; top: 0; }
    .kb-nav-item { display: block; width: 100%; text-align: left; padding: 8px 12px; border-radius: var(--radius); font-size: 13px; color: #4b5563; border: none; background: none; cursor: pointer; }
    .kb-nav-item:hover { background: #f3f4f6; color: var(--text); }
    .kb-nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
    .kb-content { min-width: 0; }
    .page-hd.compact { margin-bottom: 16px; }
    .page-hd.compact h2 { font-size: 18px; }
    .page-hd.compact p { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .hub-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; }
    .hub-tab { padding: 10px 16px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .hub-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
    .hub-badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; background: #e5e7eb; color: #374151; }
    .hub-badge.warn { background: #fef3c7; color: #b45309; }
    .hub-panel { display: none; }
    .hub-panel.active { display: block; }
    .stat-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; display: flex; align-items: center; gap: 12px; }
    .stat-icon { width: 36px; height: 36px; border-radius: var(--radius); display: grid; place-items: center; font-size: 16px; }
    .stat-icon.blue { background: #dbeafe; }
    .stat-icon.purple { background: #ede9fe; }
    .stat-icon.green { background: #dcfce7; }
    .stat-icon.amber { background: #fef3c7; }
    .stat-icon.red { background: #fee2e2; }
    .stat-val { font-size: 20px; font-weight: 700; }
    .stat-lbl { font-size: 11px; color: var(--muted); }
    .mode-switch { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .mode-opt { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius-lg); font-size: 13px; cursor: pointer; }
    .mode-opt.active { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
    .mode-card { display: flex; gap: 10px; padding: 12px; border: 2px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 8px; cursor: pointer; }
    .mode-card.active { border-color: var(--primary); background: var(--primary-light); }
    .mode-card p { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .hint-bar { font-size: 12px; color: var(--muted); padding: 10px 12px; background: #f9fafb; border-radius: var(--radius); margin-bottom: 12px; border: 1px solid var(--border); }
    .graph-split { display: grid; grid-template-columns: 200px 1fr; gap: 12px; }
    .graph-canvas.bolt { min-height: 320px; border-radius: var(--radius-lg); border: 1px solid var(--border); background: radial-gradient(circle at 30% 40%, #dbeafe, #f9fafb); }
    .graph-node.highlight { border-color: #f97316; box-shadow: 0 0 0 3px rgba(249,115,22,.2); }
    .graph-edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .debug-bar { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px; background: #f9fafb; border-radius: var(--radius); font-size: 13px; flex-wrap: wrap; }
    .channel-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
    .channel-card { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border: 2px solid var(--border); border-radius: var(--radius-lg); font-size: 13px; cursor: pointer; background: var(--panel); }
    .channel-card.on { border-color: var(--primary); background: var(--primary-light); }
    .ch-lat { font-size: 11px; color: var(--muted); }
    .decision-tree { font-size: 13px; line-height: 2; font-family: ui-monospace, monospace; }
    .tag-blue { background: var(--primary-light); border-color: #93c5fd; color: var(--primary); }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .kb-grid, .metrics, .index-grid, .home-apps, .stat-row, .channel-grid { grid-template-columns: 1fr; }
      .chat-layout, .split-layout, .retrieval-layout, .kb-layout, .graph-split { grid-template-columns: 1fr; }
      .conv-list { display: none; }
      .topbar-search { display: none; }
    }
  </style>
</head>
